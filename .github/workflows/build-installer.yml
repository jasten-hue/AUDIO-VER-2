name: Build Installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Build exe with PyInstaller
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --icon app.ico
          --add-data "index.html;."
          --add-data "lib;lib"
          --add-data "app.ico;."
          --collect-all py7zr
          --name AudioTestLogAnalyzer app.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: AudioTestLogAnalyzer-Setup
          path: installer_output/AudioTestLogAnalyzer-Setup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/AudioTestLogAnalyzer-Setup.exe
